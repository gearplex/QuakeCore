name: reconstructed-yori-parity
on:
  push:
    branches: [phase9m-yori-wall-10001]
  pull_request:
    branches: [main]

jobs:
  exact-surrogate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Apply candidate ConcreteCM patches
        run: |
          python tools/apply_rule77_post_extreme_patch.py
          python tools/apply_rule10_fix2_patch.py
          python tools/apply_rule10_nested_patch.py
          python tools/apply_teunp_history_patch.py
          python tools/apply_second_rebound_diagnostic.py
          python tools/apply_concretecm_fallback_diagnostic.py
      - run: sudo apt-get update && sudo apt-get install -y libsuperlu-dev liblapack-dev
      - name: Install OpenSeesPy 3.8.0
        run: python -m pip install --upgrade "openseespy==3.8.0.0" numpy
      - name: Build QuakeCore
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQUAKE_ENABLE_SANITIZERS=OFF
          cmake --build build -j2 --target quake_run
      - name: Materialize reconstructed exact-law job
        run: |
          python validation/yori_wall_10001/materialize_reconstructed_job.py \
            --model-input validation/yori_wall_10001/AllStoriesOpenseesModelINPUT.reconstructed_10001.txt \
            --output reconstructed_job.json
      - name: Run QuakeCore reconstructed exact-law job
        continue-on-error: true
        run: ./build/quake_run reconstructed_job.json quake_reconstructed.json
      - name: Trace offending ConcreteCM fiber state
        if: always()
        continue-on-error: true
        run: |
          mkdir -p reconstructed_comparison
          python - <<'PY'
          import json
          q=json.load(open('quake_reconstructed.json'))
          h=q['runs'][0]['history']
          with open('wall5_fiber0_strains.txt','w') as f:
              for row in h:
                  w=row['walls']['5'] if '5' in row['walls'] else row['walls'][5]
                  f.write(f"{w['fiber_strain'][0]:.17g}\n")
          PY
          g++ -std=c++20 -O2 -Iinclude validation/yori_wall_10001/concrete_cm_state_trace.cpp src/concrete_cm.cpp -o concrete_cm_state_trace
          ./concrete_cm_state_trace wall5_fiber0_strains.txt reconstructed_comparison/concrete_cm_state_trace.csv
          sed -n '640,660p' reconstructed_comparison/concrete_cm_state_trace.csv
      - name: Replay wall material histories against OpenSeesPy
        if: always()
        continue-on-error: true
        run: |
          python validation/yori_wall_10001/diagnose_material_history_parity.py \
            --job reconstructed_job.json \
            --quake quake_reconstructed.json \
            --out reconstructed_comparison/material_history_diagnostic.json
      - name: Compare to independent OpenSeesPy 3.8.0 model
        run: |
          python validation/yori_wall_10001/compare_reconstructed_exact_10001.py \
            --job reconstructed_job.json \
            --quake quake_reconstructed.json \
            --out reconstructed_comparison \
            --assert-parity
      - name: Upload reconstructed parity evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reconstructed-yori-parity
          path: |
            reconstructed_job.json
            quake_reconstructed.json
            reconstructed_comparison/
          if-no-files-found: warn
