name: phase9n-yori-multirecord

on:
  push:
    branches: [phase9m-yori-wall-10001]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  pilot:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install numerical dependencies
        run: sudo apt-get update && sudo apt-get install -y libsuperlu-dev liblapack-dev zip

      - name: Install OpenSeesPy 3.8.0
        run: python -m pip install --upgrade "openseespy==3.8.0.0" numpy

      - name: Build QuakeCore
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQUAKE_ENABLE_SANITIZERS=OFF
          cmake --build build -j2 --target quake_run

      - name: Download and verify FEMA P-695 far-field source files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p phase9n_source
          curl -L --fail --retry 3 -o phase9n_source/1_ReadMe_ATC-63_GroundMotionSet_FarField_SummaryFile.xls \
            https://s3-us-west-2.amazonaws.com/static-assets.hbrisk.com/ground-motion-sets/1_ReadMe_ATC-63_GroundMotionSet_FarField_SummaryFile.xls
          curl -L --fail --retry 3 -o phase9n_source/2b_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Original.zip \
            https://s3.us-west-2.amazonaws.com/static-assets.hbrisk.com/ground-motion-sets/2b_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Original.zip
          curl -L --fail --retry 3 -o phase9n_source/2c_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Sorted.zip \
            https://s3.us-west-2.amazonaws.com/static-assets.hbrisk.com/ground-motion-sets/2c_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Sorted.zip
          cat > phase9n_source/SHA256SUMS.expected <<'EOF'
          e775ee429b4311dc1c8b362b78640523fa331445a46e8cee8f15138f9acde1bb  1_ReadMe_ATC-63_GroundMotionSet_FarField_SummaryFile.xls
          340ea47176323c363634b456c317e553dbcfced503f3e82827355a23145b9638  2b_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Original.zip
          4b27774cafba4cef394fcda21a037ac08a452b3006e5899daddc47dd8d832b42  2c_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Sorted.zip
          EOF
          (cd phase9n_source && sha256sum -c SHA256SUMS.expected)
          zip -j phase9n_source_package.zip \
            phase9n_source/1_ReadMe_ATC-63_GroundMotionSet_FarField_SummaryFile.xls \
            phase9n_source/2b_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Original.zip \
            phase9n_source/2c_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Sorted.zip

      - name: Build exact source manifest
        run: |
          python validation/yori_wall_10001/phase9n_build_record_manifest.py \
            --source-archive phase9n_source_package.zip \
            --out phase9n_far_field_manifest.json

      - name: Materialize reconstructed exact-law base job
        run: |
          python validation/yori_wall_10001/materialize_reconstructed_job.py \
            --model-input validation/yori_wall_10001/AllStoriesOpenseesModelINPUT.reconstructed_10001.txt \
            --output reconstructed_job.json

      - name: Run four-time-step-class pilot
        run: |
          mkdir -p phase9n_results
          python validation/yori_wall_10001/phase9n_batch_validate.py \
            --manifest phase9n_far_field_manifest.json \
            --source-archive phase9n_source_package.zip \
            --base-job reconstructed_job.json \
            --quake-exe ./build/quake_run \
            --record-ids 120111 120621 120911 120921 \
            --record-scale 0.03 \
            --out phase9n_results/pilot_summary.json

      - name: Upload Phase 9N pilot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9n-yori-multirecord-pilot
          path: |
            phase9n_far_field_manifest.json
            phase9n_results/
          if-no-files-found: warn
