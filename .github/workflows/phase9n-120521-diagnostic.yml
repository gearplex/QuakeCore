name: phase9n-120521-diagnostic

on:
  push:
    branches: [phase9m-yori-wall-10001]
    paths: [.github/workflows/phase9n-120521-diagnostic.yml]
  pull_request:
    branches: [main]
    paths: [.github/workflows/phase9n-120521-diagnostic.yml]
  workflow_dispatch:

jobs:
  robust-opensees:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y libsuperlu-dev liblapack-dev
      - run: python -m pip install --upgrade "openseespy==3.8.0.0" numpy
      - name: Build QuakeCore
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo -DQUAKE_ENABLE_SANITIZERS=OFF
          cmake --build build -j2 --target quake_run
      - name: Acquire source archive and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p source
          curl -L --fail --retry 3 -o source/1_ReadMe_ATC-63_GroundMotionSet_FarField_SummaryFile.xls \
            https://s3-us-west-2.amazonaws.com/static-assets.hbrisk.com/ground-motion-sets/1_ReadMe_ATC-63_GroundMotionSet_FarField_SummaryFile.xls
          curl -L --fail --retry 3 -o source/2b_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Original.zip \
            https://s3.us-west-2.amazonaws.com/static-assets.hbrisk.com/ground-motion-sets/2b_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Original.zip
          curl -L --fail --retry 3 -o source/2c_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Sorted.zip \
            https://s3.us-west-2.amazonaws.com/static-assets.hbrisk.com/ground-motion-sets/2c_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Sorted.zip
          echo "e775ee429b4311dc1c8b362b78640523fa331445a46e8cee8f15138f9acde1bb  source/1_ReadMe_ATC-63_GroundMotionSet_FarField_SummaryFile.xls" | sha256sum -c -
          echo "340ea47176323c363634b456c317e553dbcfced503f3e82827355a23145b9638  source/2b_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Original.zip" | sha256sum -c -
          echo "4b27774cafba4cef394fcda21a037ac08a452b3006e5899daddc47dd8d832b42  source/2c_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Sorted.zip" | sha256sum -c -
          python - <<'PY'
          import zipfile
          names=[
            "1_ReadMe_ATC-63_GroundMotionSet_FarField_SummaryFile.xls",
            "2b_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Original.zip",
            "2c_ATC-63_Far-Field_GroundMotionAccelTextFiles_Unscaled_Sorted.zip",
          ]
          with zipfile.ZipFile("source_archive.zip","w",zipfile.ZIP_DEFLATED) as z:
            for n in names: z.write("source/"+n,n)
          PY
          python validation/yori_wall_10001/phase9n_build_record_manifest.py --source-archive source_archive.zip --out manifest.json
      - name: Materialize 120521 and run QuakeCore
        run: |
          python validation/yori_wall_10001/materialize_reconstructed_job.py \
            --model-input validation/yori_wall_10001/AllStoriesOpenseesModelINPUT.reconstructed_10001.txt \
            --output base.json
          python validation/yori_wall_10001/phase9n_materialize_record_job.py \
            --base-job base.json --source-archive source_archive.zip --manifest manifest.json \
            --record-id 120521 --scale 0.03 --out job_120521.json
          ./build/quake_run job_120521.json quake_120521.json
      - name: Robust OpenSees subdivision diagnostic
        run: |
          python validation/yori_wall_10001/compare_reconstructed_robust_opensees.py \
            --job job_120521.json --quake quake_120521.json --max-depth 8 \
            --out robust_120521.json
      - name: Upload diagnostic
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase9n-120521-robust-diagnostic
          retention-days: 14
          path: |
            job_120521.json
            robust_120521.json
